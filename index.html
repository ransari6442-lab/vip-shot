<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;

    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
    radial-gradient(
        circle at 50% 5%,
        #3b4cff 0%,
        #171b52 28%,
        #090b24 60%,
        #02030d 100%
    );

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;

    width:430px;
    height:430px;

    border-radius:50%;

    background:rgba(70,80,255,.25);

    filter:blur(110px);

    top:-180px;
    left:50%;

    transform:translateX(-50%);

    pointer-events:none;
}

.card{
    width:100%;
    max-width:430px;
    text-align:center;
    padding:25px 12px;

    position:relative;
    z-index:2;
}

.dp{
    display:block;

    width:118px;
    height:118px;

    margin:0 auto 18px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #6f7cff;

    box-shadow:
        0 0 15px #5263ff,
        0 0 40px rgba(80,95,255,.75),
        0 0 70px rgba(80,95,255,.35);
}

h1{
    font-size:clamp(24px,7vw,30px);

    line-height:1.2;

    font-weight:900;

    color:#fff;

    margin-bottom:9px;

    text-shadow:
        0 2px 15px rgba(90,100,255,.8),
        0 3px 15px rgba(0,0,0,.9);
}

.desc{
    max-width:350px;

    margin:0 auto 23px;

    color:#c9ceff;

    font-size:14px;

    line-height:1.55;
}

.join{
    position:relative;
    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    width:100%;
    min-height:58px;

    padding:16px 20px;

    border-radius:14px;

    border:2px solid #8d96ff;

    background:
    linear-gradient(
        135deg,
        #6572ff 0%,
        #4654e8 45%,
        #2935a8 100%
    );

    color:#fff;

    text-decoration:none;

    font-size:18px;

    font-weight:900;

    letter-spacing:.4px;

    box-shadow:
        0 5px 0 #1b246f,
        0 10px 30px rgba(70,85,255,.55);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.join::after{
    content:"";

    position:absolute;

    inset:0;

    border-radius:14px;

    box-shadow:
        0 0 25px rgba(100,115,255,.8);

    opacity:.7;

    animation:pulse 1.8s infinite;

    pointer-events:none;
}

@keyframes pulse{
    0%,100%{
        opacity:.35;
    }

    50%{
        opacity:.9;
    }
}

.join::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:55%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.85),
        transparent
    );

    transform:skewX(-25deg);

    animation:shine 2.7s infinite;
}

@keyframes shine{
    0%{
        left:-120%;
    }

    45%,100%{
        left:150%;
    }
}

.join:hover{
    transform:translateY(-3px);

    box-shadow:
        0 8px 0 #1b246f,
        0 15px 40px rgba(80,95,255,.8);
}

.join:active{
    transform:translateY(2px);

    box-shadow:
        0 3px 0 #1b246f,
        0 7px 18px rgba(80,95,255,.45);
}

.telegram{
    font-size:22px;
}

.info{
    margin-top:20px;

    padding:14px 10px;

    border-radius:13px;

    border:1px solid rgba(100,115,255,.55);

    background:rgba(2,4,20,.72);

    backdrop-filter:blur(8px);

    color:#d5d9ff;

    font-size:13px;

    line-height:1.9;

    box-shadow:
        0 0 20px rgba(70,85,255,.18);
}

.footer{
    margin-top:20px;

    color:#858bb5;

    font-size:11px;

    line-height:1.6;
}

.ad-container{
    margin-top:20px;

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;
}

@media(max-width:360px){

    body{
        padding:10px;
    }

    .card{
        padding:20px 8px;
    }

    .dp{
        width:95px;
        height:95px;
        margin-bottom:15px;
    }

    h1{
        font-size:23px;
    }

    .desc{
        font-size:13px;
        margin-bottom:20px;
    }

    .join{
        min-height:54px;
        padding:14px;
        font-size:16px;
    }

    .info{
        font-size:12px;
    }

}

</style>

</head>
